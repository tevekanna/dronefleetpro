events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # HTTP server. Serves the application directly on port 80.
    #
    # For anything other than local use, terminate TLS in front of this
    # server (a reverse proxy or load balancer), or enable the example HTTPS
    # server block at the end of this file.
    server {
        listen 80;
        server_name _;

        # Frontend
        location / {
            proxy_pass http://frontend:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend API
        location /api/ {
            proxy_pass http://backend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # DJI log file uploads and large ArduPilot .bin DataFlash logs can be large.
            client_max_body_size 256M;
            proxy_read_timeout 300s;
        }
    }

    # Example HTTPS server. To use it:
    #   1. replace dfp.example.com with your own domain;
    #   2. mount your certificate and key into the nginx container, for
    #      example ./certs:/etc/nginx/certs:ro in docker-compose.yml;
    #   3. publish port 443 ("443:443") in docker-compose.yml;
    #   4. uncomment the block below, and replace the body of the port 80
    #      server above with:  return 301 https://$host$request_uri;
    #
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name dfp.example.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #
    #     # Modern TLS defaults: TLS 1.2 and 1.3 only.
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_prefer_server_ciphers off;
    #     ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
