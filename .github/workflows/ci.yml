name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs for the same ref so PR pushes do not queue up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Superuser credentials are required: #[sqlx::test] creates a fresh
        # database per test, which needs CREATEDB rights.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      # Pinned to the same major.minor as backend/Dockerfile (rust:1.88-slim)
      # so CI builds with the same toolchain as production images.
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88
        with:
          components: clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      # Clippy has never been configured for this crate (no clippy.toml, no
      # crate-level lint attributes, no [lints] table in Cargo.toml), so the
      # existing warning baseline is untriaged. Run it without -D warnings and
      # keep it non-blocking until the warnings are triaged — mirroring how
      # the pre-existing ESLint warnings were handled in v2.50.1.
      - name: Clippy (non-blocking)
        run: cargo clippy --all-targets --locked
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Node 20 matches frontend/Dockerfile (node:20-alpine).
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # The Playwright e2e suite (npm run test:e2e) is deliberately NOT run
      # here — it requires the full stack (backend + database) to be running
      # and is out of scope for this workflow.

  version-lockstep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version lockstep
        run: ./scripts/check-version-lockstep.sh
