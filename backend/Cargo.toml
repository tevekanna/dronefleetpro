[package]
name = "dronefleetpro-backend"
version = "2.55.0"
edition = "2021"
authors = ["Lars Wallström <lars@terrapics.se>"]
license = "AGPL-3.0-only"
repository = "https://github.com/tevekanna/dronefleetpro"
publish = false
build = "build.rs"
default-run = "dronefleetpro-backend"

[build-dependencies]
chrono = "0.4"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "chrono", "json", "uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
jsonwebtoken = "9"
bcrypt = "0.15"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
async-trait = "0.1"
thiserror = "1"
tower-http = { version = "0.5", features = ["cors", "trace", "limit"] }
tower_governor = "0.4"
axum-extra = { version = "0.9", features = ["multipart"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }
csv = "1.3"
regex = "1"
printpdf = "0.7"
dji-log-parser = "0.5"
ardupilot-binlog = "=0.2.0"
mavlink = { version = "0.18", default-features = false, features = ["std", "dialect-ardupilotmega", "mav2-message-extensions"] }
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
sun-times = "0.2"

[profile.release]
embed-bitcode = false
lto = false

